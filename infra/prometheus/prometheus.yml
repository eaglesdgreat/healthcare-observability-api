global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: healthcare-observability-api
    metrics_path: /metrics
    static_configs:
      - targets: ['observability-api:3000']
        labels:
          service_name: healthcare-observability-api

  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8888']
