name: CI

on:
  pull_request:
    branches: [main]
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: 1. Typecheck and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

  unit-tests:
    name: 2. Unit tests
    needs: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

  integration-tests:
    name: 3. Integration tests
    needs: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run integration tests
        run: pnpm run test:integration

  e2e-tests:
    name: 4. End-to-end tests
    needs: integration-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run end-to-end tests
        run: pnpm run test:e2e

  smoke-test:
    name: 5. Production smoke and health checks
    needs: e2e-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production bundle
        run: pnpm run build

      - name: Start production app and verify health, metrics, and logs
        shell: bash
        run: |
          set -Eeuo pipefail

          port="${PORT:-3000}"
          log_file="$RUNNER_TEMP/observability-api.log"
          PORT="$port" NODE_ENV=production node dist/main.js >"$log_file" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true' EXIT

          ready=false
          deadline=$((SECONDS + 60))
          while (( SECONDS < deadline )); do
            if curl --connect-timeout 1 --max-time 5 \
              --fail --silent --show-error "http://127.0.0.1:${port}/health" \
              --output "$RUNNER_TEMP/health.json"; then
              ready=true
              break
            fi

            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "Application exited before becoming healthy."
              cat "$log_file"
              exit 1
            fi
            sleep 1
          done

          if [[ "$ready" != true ]]; then
            echo "Application did not become healthy within 60 seconds."
            cat "$log_file"
            exit 1
          fi

          node -e '
            const fs = require("node:fs");
            const health = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (health.status !== "ok") {
              throw new Error(`Unexpected health response: ${JSON.stringify(health)}`);
            }
          ' "$RUNNER_TEMP/health.json"

          curl --connect-timeout 1 --max-time 10 \
            --fail --silent --show-error "http://127.0.0.1:${port}/metrics" \
            --output "$RUNNER_TEMP/metrics.txt"
          grep -q '^healthcare_http_requests_total' "$RUNNER_TEMP/metrics.txt"
          grep -q '^healthcare_process_cpu_user_seconds_total' "$RUNNER_TEMP/metrics.txt"

          for attempt in $(seq 1 10); do
            if grep -q '"message":"request completed"' "$log_file"; then
              break
            fi
            sleep 1
          done

          node - "$log_file" <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");

          const requestLogs = fs
            .readFileSync(process.argv[2], "utf8")
            .split("\n")
            .filter((line) => line.includes('"message":"request completed"'));

          assert.ok(requestLogs.length > 0, "expected a structured HTTP request log");
          const entry = JSON.parse(requestLogs[0]);
          assert.equal(entry.service.name, "healthcare-observability-api");
          assert.equal(entry.req.method, "GET");
          assert.equal(entry.res.statusCode, 200);
          assert.match(entry.traceId, /^[0-9a-f]{32}$/);
          assert.match(entry.spanId, /^[0-9a-f]{16}$/);
          NODE

          echo "Production health, metrics, and trace-correlated JSON logs passed."

  docker-build:
    name: 6. Build release Docker image
    needs: smoke-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build release image
        run: docker build --target release --tag healthcare-observability:${{ github.sha }} .
